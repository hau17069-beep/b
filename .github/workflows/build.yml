name: Build Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest    # Quay lại Apple Silicon, cấp phát tức thì

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install ldid make git
        brew install --cask gcc-arm-embedded || true
        # KHÔNG cài fakeroot từ brew - để Theos tự build

    - name: Setup Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV

    - name: Install Theos Dependencies
      run: |
        # Theos sẽ tự tải và build fakeroot đúng kiến trúc
        $THEOS/bin/install-libipatcher.sh || true
        # Hoặc dùng fakeroot bundled trong Theos
        ls $THEOS/toolchain/

    - name: Build Tweak
      run: |
        # Tắt fakeroot bằng biến môi trường nếu cần
        export THEOS_PACKAGE_SCHEME=rootless
        make package FINALPACKAGE=1 || make package
      env:
        THEOS: ${{ env.THEOS }}

    - name: Upload Deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LCProtectionRecon-deb
        path: packages/*.deb
